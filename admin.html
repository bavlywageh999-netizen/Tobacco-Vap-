<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{color-scheme:dark;--bg:#0a0a0a;--sf:#151515;--sf2:#1e1e1e;--bd:#2c2c2c;--tx:#f2f0ea;--mu:#9b978d;--gd:#d4a24c;--gd2:#f0c978;--ok:#3ecf8e;--bad:#ff5c5c;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:'Poppins',system-ui,sans-serif;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gd);outline-offset:2px}
.btn{background:var(--gd);color:#111;border:0;border-radius:8px;padding:.6rem 1.1rem;font-weight:600}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.sm{padding:.35rem .7rem;font-size:.85rem}
input,select,textarea{background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:.55rem .75rem;width:100%}
/* store */
.top{position:sticky;top:0;z-index:20;background:#0a0a0aee;backdrop-filter:blur(8px);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:1rem;padding:.6rem 1.2rem;justify-content:space-between}
.logo{height:54px;width:54px;border-radius:50%;cursor:pointer;user-select:none;-webkit-user-drag:none}
.brand{display:flex;align-items:center;gap:.7rem;font-weight:700;letter-spacing:.04em}
.top input{max-width:340px}
.cartb{position:relative}
.cartb span{position:absolute;top:-8px;right:-8px;background:var(--gd);color:#111;border-radius:99px;font-size:.72rem;padding:0 .4rem;font-weight:700}
.strip{background:#000;text-align:center;padding:.8rem 1rem;font-size:1.15rem;font-weight:600;border-bottom:1px solid var(--bd)}
.hero{min-height:420px;display:grid;align-items:center;padding:3rem 1.5rem 3rem 8vw;background:radial-gradient(60% 90% at 85% 50%,#3a2a0e 0,transparent 70%),linear-gradient(120deg,#0d0d0d,#1a1405)}
.hero h1{font-size:clamp(2.4rem,7vw,4.6rem);line-height:1.02;margin:0 0 1rem;max-width:11ch}
.hero p{color:var(--mu);max-width:34ch;margin:0 0 1.5rem}
.cats{display:flex;gap:.5rem;flex-wrap:wrap;padding:1.5rem 1.2rem 0}
.cats button{background:var(--sf);border:1px solid var(--bd);border-radius:99px;padding:.4rem 1rem}
.cats button.on{background:var(--gd);color:#111;border-color:var(--gd)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1.1rem;padding:1.2rem}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.thumb{aspect-ratio:1;display:grid;place-items:center;font-size:2.6rem;font-weight:700;color:var(--gd);background:linear-gradient(145deg,#1c1c1c,#0e0e0e)}
.card .in{padding:.9rem;display:flex;flex-direction:column;gap:.4rem;flex:1}
.card small{color:var(--mu)}
.price{font-weight:700;color:var(--gd2)}
.card .btn{margin-top:auto}
.out{color:var(--bad);font-size:.85rem}
footer{border-top:1px solid var(--bd);padding:1.5rem;color:var(--mu);text-align:center;font-size:.9rem}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(380px,100%);background:var(--sf);border-left:1px solid var(--bd);z-index:40;padding:1rem;display:none;flex-direction:column;gap:.7rem;padding-top:calc(1rem + env(safe-area-inset-top,0px))}
.drawer.open{display:flex}
.row{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.items{flex:1;overflow:auto}
.items .row{padding:.5rem 0;border-bottom:1px solid var(--bd)}
/* chat */
.chatfab{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:30;border-radius:99px;padding:.8rem 1.2rem}
.chat{position:fixed;right:1rem;bottom:calc(4.5rem + env(safe-area-inset-bottom,0px));width:min(340px,calc(100% - 2rem));height:420px;background:var(--sf);border:1px solid var(--bd);border-radius:14px;z-index:35;display:none;flex-direction:column;overflow:hidden}
.chat.open{display:flex}
.chat h4{margin:0;padding:.8rem 1rem;background:var(--sf2);border-bottom:1px solid var(--bd)}
.msgs{flex:1;overflow:auto;padding:.8rem;display:flex;flex-direction:column;gap:.5rem}
.m{max-width:80%;padding:.5rem .8rem;border-radius:12px;background:var(--sf2);font-size:.92rem}
.m.me{align-self:flex-end;background:var(--gd);color:#111}
.chat form{display:flex;gap:.4rem;padding:.6rem;border-top:1px solid var(--bd)}
.age{position:fixed;inset:0;background:#000d;z-index:100;display:grid;place-items:center;padding:1rem}
.age div{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:2rem;max-width:380px;text-align:center}
/* admin */
#admin{display:none;position:fixed;inset:0;z-index:60;background:var(--bg);grid-template-columns:220px 1fr;padding-top:env(safe-area-inset-top,0px)}
#admin.open{display:grid}
.side{background:var(--sf);border-right:1px solid var(--bd);padding:1rem;display:flex;flex-direction:column;gap:.3rem}
.side .brand{margin-bottom:1rem}
.side .logo{height:38px;width:38px;cursor:default}
.side button{text-align:left;background:none;border:0;border-radius:8px;padding:.6rem .8rem;color:var(--mu)}
.side button.on{background:var(--gd);color:#111;font-weight:600}
.main{overflow:auto;padding:1.2rem}
.main h2{margin:.2rem 0 1rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.8rem;margin-bottom:1rem}
.stat{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:1rem}
.stat small{color:var(--mu)}.stat b{display:block;font-size:1.5rem}
.panel{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:1rem;margin-bottom:1rem}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px}
.bars i{flex:1;background:var(--gd);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars i em{position:absolute;bottom:-1.3rem;left:0;right:0;text-align:center;font-size:.68rem;color:var(--mu);font-style:normal}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:.55rem .5rem;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:500}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.6rem;align-items:end}
.tag{padding:.1rem .5rem;border-radius:99px;background:#3a2a0e;color:var(--gd2);font-size:.8rem}
.admchat{display:grid;grid-template-columns:200px 1fr;gap:.8rem;min-height:340px}
.admchat .list{display:flex;flex-direction:column;gap:.3rem}
.admchat .list button{text-align:left;background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:.5rem}
.admchat .list button.on{border-color:var(--gd)}
.login{display:grid;place-items:center;min-height:100%;grid-column:1/-1}
.login form{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:2rem;width:min(340px,92%);display:grid;gap:.8rem}
@media(max-width:720px){#admin.open{grid-template-columns:1fr;grid-template-rows:auto 1fr}.side{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--bd)}.side .brand{width:100%;margin:0}.admchat{grid-template-columns:1fr}.top input{display:none}}
.btn,.cats button,.side button,.chatfab{position:relative}.btn:not(.cartb),.cats button,.side button,.chatfab{overflow:hidden}
@media(prefers-reduced-motion:no-preference){.hero h1{animation:rise .8s ease both}@keyframes rise{from{opacity:0;transform:translateY(14px)}}
button,.card,.logo,.thumb{transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .2s,background .2s,border-color .2s}
button:active,.logo:active{transform:scale(.88)}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px #d4a24c45}
.cats button:hover,.side button:hover{transform:translateY(-2px)}
.card:hover{transform:translateY(-6px);border-color:var(--gd);box-shadow:0 12px 28px #0009}
.card:hover .thumb{transform:scale(1.06)}.card:active{transform:scale(.96)}
.logo:active{transform:scale(.85) rotate(-10deg)}
.card{animation:cin .4s ease both}@keyframes cin{from{opacity:0;transform:translateY(16px) scale(.97)}}
.drawer.open{animation:sl .3s ease}@keyframes sl{from{transform:translateX(100%)}}
.chat.open{animation:pp .28s cubic-bezier(.3,1.5,.5,1);transform-origin:bottom right}@keyframes pp{from{opacity:0;transform:scale(.7)}}
#admin.open{animation:fd .35s ease}@keyframes fd{from{opacity:0;transform:scale(1.02)}}
.m{animation:pp .25s ease}.panel,.stat{animation:cin .4s ease both}
.bump{animation:bp .4s ease}@keyframes bp{50%{transform:scale(1.7)}}
.rip{position:absolute;border-radius:50%;background:#fff7;transform:scale(0);animation:rp .6s linear forwards;pointer-events:none}@keyframes rp{to{transform:scale(4);opacity:0}}}

.lg{grid-column:1/-1;background:#000;display:grid;place-items:center;height:100%;overflow:auto}

let D={products:[],orders:[],chats:{}},sid='';
const save=()=>{};
function reload(){return D}
const SB_URL='PASTE_YOUR_PROJECT_URL',SB_KEY='PASTE_YOUR_PUBLISHABLE_OR_ANON_KEY';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const remote={
 async products(){const{data}=await sb.from('products').select('id,name,category,price,stock').order('id');if(data){D.products=data.map(p=>({id:p.id,name:p.name,cat:p.category,price:+p.price,cost:0,stock:p.stock}));shop()}},
 async order(items,n,p,a){const{error}=await sb.rpc('place_order',{p_name:n,p_phone:p,p_address:a,p_items:items});return error},
 async chat(t){await sb.rpc('send_chat',{p_session:sid,p_body:t})},
 async pull(){const{data}=await sb.rpc('get_chat',{p_session:sid});if(data){D.chats[sid]=data.map(m=>({f:m.sender,t:m.body}));if($('#chat').classList.contains('open'))chatUI()}},
 async admin(){
  const{data:a}=await sb.from('admins').select('user_id').limit(1);if(!a||!a.length)return false;
  const[pr,od,ch]=await Promise.all([sb.from('products').select('id,name,category,price,stock,discount_percent,product_costs(cost)').order('id'),sb.from('orders').select('*,order_items(product_name,qty)').order('id'),sb.from('chat_messages').select('*').order('created_at')]);
  D.products=(pr.data||[]).map(p=>{const c=p.product_costs;return{id:p.id,name:p.name,cat:p.category,price:+p.price,stock:p.stock,disc:p.discount_percent,cost:+((Array.isArray(c)?c[0]?.cost:c?.cost)||0)}});
  D.orders=(od.data||[]).map(o=>({id:o.id,name:o.customer_name,phone:o.phone,addr:o.address,lines:(o.order_items||[]).map(i=>({name:i.product_name,qty:i.qty})),total:+o.total,cost:+o.cost,status:o.status,at:new Date(o.created_at).getTime()}));
  D.chats={};(ch.data||[]).forEach(m=>(D.chats[m.session_id]=D.chats[m.session_id]||[]).push({f:m.sender,t:m.body}));
  return true}
};
let authed=false,tab='Overview',activeChat=null;
function openAdmin(){D=reload();$('#admin').classList.add('open');adm()}
function closeAdmin(){sb.auth.signOut().finally(()=>location.href='index.html')}
function adm(){
  const A=$('#admin');
  if(!authed){A.innerHTML=`<div class="lg"><div class="stage"><form class="lbox" id="lf"><label for="lp">Password</label><div class="pw"><input id="lp" type="password" autocomplete="current-password" autofocus><button type="button" id="eye" aria-label="Show password">&#128065;</button></div><div class="lrow"><label class="rm"><input type="checkbox" id="rm" checked> Remember me</label><a href="#" id="fg">Forgot password?</a></div><div id="le" role="alert"></div><button class="btn gbtn">Sign in</button><a href="index.html" class="back">Back to shop</a></form></div></div>`;
    $('#eye').onclick=()=>{const p=$('#lp');p.type=p.type==='password'?'text':'password'};
    $('#fg').onclick=async e=>{e.preventDefault();const{error}=await sb.auth.resetPasswordForEmail(ADMIN_EMAIL);$('#le').textContent=error?'Could not send the reset link. Try again.':'A reset link was sent to the admin email.'};
    $('#lf').onsubmit=async e=>{e.preventDefault();$('#le').textContent='';try{localStorage.setItem('tv_rem',$('#rm').checked?'1':'0')}catch(x){}
      const{error}=await sb.auth.signInWithPassword({email:ADMIN_EMAIL,password:$('#lp').value});
      if(error||!(await remote.admin())){await sb.auth.signOut();$('#lp').value='';$('#le').textContent='Wrong password. Try again.';return}authed=true;adm()};return}
  const low=D.products.filter(p=>p.stock<=5).length;
  A.innerHTML=`<nav class="side"><div class="brand"><img class="logo" src="${LOGO}" alt=""><span>Admin</span></div>${['Overview','Products','Orders','Support','Promos'].map(t=>`<button class="${t===tab?'on':''}" data-t="${t}">${t}${t==='Products'&&low?` (${low} low)`:''}</button>`).join('')}<button id="so" style="margin-top:auto">Sign out</button></nav><div class="main" id="mn"></div>`;
  A.querySelectorAll('[data-t]').forEach(b=>b.onclick=async()=>{tab=b.dataset.t;await remote.admin();adm()});$('#so').onclick=closeAdmin;
  ({Overview:ov,Products:pr,Orders:od,Support:sp,Promos:pm})[tab]();
}
async function pm(){
  const{data}=await sb.from('promo_codes').select('*').order('created_at',{ascending:false});
  $('#mn').innerHTML=`<h2>Promo codes</h2><div class="panel"><form class="form" id="mf"><label>Code<input name="code" required minlength="3" placeholder="WELCOME10"></label><label>Discount %<input name="pct" type="number" min="1" max="90" required></label><button class="btn">Add code</button></form></div><div class="panel tw">${data&&data.length?`<table><tr><th>Code</th><th>Discount</th><th>Active</th><th></th></tr>${data.map(c=>`<tr><td>${esc(c.code)}</td><td>${c.percent}%</td><td><input type="checkbox" style="width:auto" data-pa="${esc(c.code)}" ${c.active?'checked':''}></td><td><button class="btn ghost sm" data-pd="${esc(c.code)}">Delete</button></td></tr>`).join('')}</table>`:'<p style="color:var(--mu)">No promo codes yet. Add one above and customers can enter it at checkout.</p>'}</div>`;
  $('#mf').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const{error}=await sb.from('promo_codes').insert({code:f.code.trim().toUpperCase(),percent:+f.pct});if(error)return alert(error.message);pm()};
  $('#mn').querySelectorAll('[data-pa]').forEach(i=>i.onchange=()=>sb.from('promo_codes').update({active:i.checked}).eq('code',i.dataset.pa));
  $('#mn').querySelectorAll('[data-pd]').forEach(b=>b.onclick=async()=>{await sb.from('promo_codes').delete().eq('code',b.dataset.pd);pm()});
}
function ov(){
  const s=D.orders.reduce((a,o)=>a+o.total,0),c=D.orders.reduce((a,o)=>a+o.cost,0),n=D.orders.length;
  const days=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()-(6-i)*864e5),k=d.toDateString();return{l:d.getDate()+'/'+(d.getMonth()+1),v:D.orders.filter(o=>new Date(o.at).toDateString()===k).reduce((a,o)=>a+o.total,0)}});
  const mx=Math.max(1,...days.map(d=>d.v));
  $('#mn').innerHTML=`<h2>Overview</h2><div class="stats"><div class="stat"><small>Total sales</small><b>${L(s)}</b></div><div class="stat"><small>Profit</small><b>${L(s-c)}</b></div><div class="stat"><small>Orders</small><b>${n}</b></div><div class="stat"><small>Products</small><b>${D.products.length}</b></div><div class="stat"><small>Average order</small><b>${L(n?Math.round(s/n):0)}</b></div></div>
  <div class="panel"><b>Sales, last 7 days</b><div class="bars" style="margin:1rem 0 1.6rem">${days.map(d=>`<i style="height:${d.v/mx*100}%" title="${L(d.v)}"><em>${d.l}</em></i>`).join('')}</div></div>
  <div class="panel"><b>Stock status</b><div class="tw"><table><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th></tr>${D.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.cat)}</td><td>${L(p.price)}</td><td style="color:${p.stock<=5?'var(--bad)':'inherit'}">${p.stock}</td></tr>`).join('')}</table></div></div>`}
function pr(){
  $('#mn').innerHTML=`<h2>Products</h2><div class="panel"><form class="form" id="pf"><label>Name<input name="name" required></label><label>Category<input name="cat" required placeholder="Pods"></label><label>Price (L.E.)<input name="price" type="number" min="0" required></label><label>Cost (L.E.)<input name="cost" type="number" min="0" required></label><label>Stock<input name="stock" type="number" min="0" required></label><label>Discount %<input name="discount" type="number" min="0" max="90" value="0"></label><button class="btn">Add product</button></form></div>
  <div class="panel tw"><table><tr><th>Product</th><th>Category</th><th>Price</th><th>Discount %</th><th>Stock</th><th></th></tr>${D.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.cat)}</td><td><input style="width:90px" type="number" value="${p.price}" data-p="${p.id}"></td><td><input style="width:70px" type="number" min="0" max="90" value="${p.disc||0}" data-ds="${p.id}"></td><td><input style="width:80px" type="number" value="${p.stock}" data-s="${p.id}"></td><td><button class="btn ghost sm" data-d="${p.id}">Delete</button></td></tr>`).join('')}</table></div>`;
  $('#pf').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const{data,error}=await sb.from('products').insert({name:f.name,category:f.cat,price:+f.price,stock:+f.stock,discount_percent:+(f.discount||0)}).select('id').single();if(error)return alert(error.message);await sb.from('product_costs').insert({product_id:data.id,cost:+f.cost});await remote.admin();pr()};
  $('#mn').querySelectorAll('[data-p]').forEach(i=>i.onchange=()=>sb.from('products').update({price:+i.value}).eq('id',i.dataset.p));
  $('#mn').querySelectorAll('[data-s]').forEach(i=>i.onchange=()=>sb.from('products').update({stock:+i.value}).eq('id',i.dataset.s));
  $('#mn').querySelectorAll('[data-ds]').forEach(i=>i.onchange=()=>sb.from('products').update({discount_percent:Math.min(90,Math.max(0,+i.value||0))}).eq('id',i.dataset.ds));
  $('#mn').querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{await sb.from('products').delete().eq('id',b.dataset.d);await remote.admin();pr()});
}
function od(){
  $('#mn').innerHTML=`<h2>Orders</h2><div class="panel tw">${D.orders.length?`<table><tr><th>#</th><th>Customer</th><th>Phone</th><th>Address</th><th>Items</th><th>Total</th><th>Status</th></tr>${[...D.orders].reverse().map(o=>`<tr><td>${o.id}</td><td>${esc(o.name)}</td><td>${esc(o.phone)}</td><td>${esc(o.addr)}</td><td>${o.lines.map(l=>esc(l.name)+' ×'+l.qty).join(', ')}</td><td>${L(o.total)}</td><td><select data-o="${o.id}">${['New','Confirmed','Delivered','Cancelled'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</table>`:'<p style="color:var(--mu)">No orders yet. Orders from the shop appear here.</p>'}</div>`;
  $('#mn').querySelectorAll('[data-o]').forEach(s=>s.onchange=()=>sb.from('orders').update({status:s.value}).eq('id',s.dataset.o));
}
function sp(){
  D=reload();const ids=Object.keys(D.chats);if(!activeChat&&ids.length)activeChat=ids[0];
  const msgs=D.chats[activeChat]||[];
  $('#mn').innerHTML=`<h2>Support chat</h2><div class="panel">${ids.length?`<div class="admchat"><div class="list">${ids.map(i=>`<button class="${i===activeChat?'on':''}" data-c="${i}">Customer ${i.slice(1)}<br><small style="color:var(--mu)">${D.chats[i].length} messages</small></button>`).join('')}</div><div style="display:flex;flex-direction:column;gap:.6rem"><div class="msgs" style="flex:1;max-height:300px;background:var(--bg);border-radius:8px">${msgs.map(m=>`<div class="m ${m.f==='s'?'me':''}">${esc(m.t)}</div>`).join('')}</div><form id="rf" class="row"><input id="ri" placeholder="Reply to customer…" autocomplete="off"><button class="btn">Send</button></form></div></div>`:'<p style="color:var(--mu)">No conversations yet. Customer messages appear here.</p>'}</div>`;
  $('#mn').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{activeChat=b.dataset.c;sp()});
  const rf=$('#rf');if(rf)rf.onsubmit=async e=>{e.preventDefault();const t=$('#ri').value.trim();if(!t)return;await sb.from('chat_messages').insert({session_id:activeChat,sender:'s',body:t});await remote.admin();sp()};
}
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.btn,.cats button,.side button,.chatfab');if(!b||b.matches('.cartb'))return;const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height),x=document.createElement('span');x.className='rip';x.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;b.appendChild(x);setTimeout(()=>x.remove(),650)});
document.addEventListener('click',e=>{if(e.target.closest('[data-a]')){const c=$('#cc');c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump')}});

(async()=>{try{if(localStorage.getItem('tv_rem')==='0')await sb.auth.signOut()}catch(e){}const{data}=await sb.auth.getSession();if(data.session&&await remote.admin())authed=true;adm()})();
setInterval(async()=>{if(authed&&tab==='Support'&&!($('#ri')&&$('#ri').value)){await remote.admin();sp()}},5000);
</script></body></html>
